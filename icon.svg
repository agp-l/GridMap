<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <!-- Tmavé zaoblené pozadí -->
    <rect width="512" height="512" rx="112" fill="#17171a" />
    
    <!-- Středový kříž (podkres) -->
    <path d="M256 120 L256 392 M120 256 L392 256" stroke="#52525b" stroke-width="24" stroke-linecap="round" />
    
    <!-- Mřížka - 4 čtverce -->
    <!-- Zelený aktivní čtverec vpravo nahoře -->
    <rect x="268" y="120" width="124" height="124" rx="24" fill="#2fd35a" />
    
    <!-- Zbylé prázdné čtverce -->
    <rect x="120" y="120" width="124" height="124" rx="24" fill="none" stroke="#e5e5e0" stroke-width="16" />
    <rect x="120" y="268" width="124" height="124" rx="24" fill="none" stroke="#e5e5e0" stroke-width="16" />
    <rect x="268" y="268" width="124" height="124" rx="24" fill="none" stroke="#e5e5e0" stroke-width="16" />
</svg>
